name: Import reference Arduino source

on:
  push:
    paths:
      - '.github/workflows/import-reference-source.yml'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact project source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p arduino
          curl --fail --location --silent --show-error \
            'https://ucfcdc92adace6ec843404e3839e.dl.dropboxusercontent.com/cd/0/get/DIPmfb3eBVuBekL_B4agwVoeK2eI-l4Q7AqStglTwPVkc2JNqSrIC1j2mS16sXSc9ygKJE3lzJf_Gk82jGMEQ-XOzZ3O_W9Ju-Up24K-8SBsJKjKsFA3YASdb4D5RhWWUQ8_4eTYxozcb-AnIQM61y0kpAgrv8dxEcS0fCwMWSxpyA/file?c_luid=fbd69693' \
            --output arduino/LC75826_Sony_CDX_A250_panel_Car_Radio_V2.ino
          echo '2357d9ba8443bff3d322f1299a11764cd86c8f34f37af7daad159d069078d256  arduino/LC75826_Sony_CDX_A250_panel_Car_Radio_V2.ino' | sha256sum --check --strict
      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arduino/LC75826_Sony_CDX_A250_panel_Car_Radio_V2.ino
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Import exact LC75826 Arduino reference source'
          git push
